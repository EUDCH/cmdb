name: Deploy

# Phase 1 trigger per ADR-0004: every push to main ships. Phase 1.5 will
# swap this to `release: { types: [published] }` once feature velocity
# slows and stability matters more than freshness. workflow_dispatch
# stays in both phases for manual rollbacks.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (default: current commit SHA)"
        required: false
        default: ""

# Tag policy:
#   - ghcr.io/eudch/cmdb:<commit-sha>  (immutable, pinned by deploy.sh)
#   - ghcr.io/eudch/cmdb:main          (floating, last-good for manual recovery)
#
# A registry tag is never deleted — rollback to an arbitrary prior SHA
# stays one `deploy.sh <sha>` invocation away.

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build + push + deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6

      - name: Resolve deploy tag
        id: tag
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/eudch/cmdb:${{ steps.tag.outputs.value }}
            ghcr.io/eudch/cmdb:main
          labels: |
            org.opencontainers.image.source=https://github.com/EUDCH/cmdb
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        # The deploy key is the only secret this workflow uses besides
        # GITHUB_TOKEN. Pinned known_hosts prevents MITM on first connect.
        run: |
          install -d -m 0700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 0600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            /opt/cmdb/deploy.sh "${{ steps.tag.outputs.value }}"
