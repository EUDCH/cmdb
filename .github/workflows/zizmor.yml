# Calls the org-shared reusable zizmor workflow (EUDCH/.github) to scan this
# repo's GitHub Actions workflows for supply-chain and injection risks.
# Pinned to a commit SHA, like every other action reference in this repo.
# Findings land in this repo's Security tab (report-only during calibration).
name: zizmor

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  zizmor:
    uses: EUDCH/.github/.github/workflows/zizmor.yml@f490ec47e62cdd43550291a657ecd916d1991df0  # EUDCH/.github#1
