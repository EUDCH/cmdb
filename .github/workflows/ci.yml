name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2 requires a paid license for org repos; running
      # the OSS gitleaks binary directly keeps the scan free + reproducible.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          cache: true
      - run: bun install --frozen-lockfile
      - name: TypeScript & Astro type-check
        run: bun run check
      - name: TypeScript type-check
        run: bun run typecheck
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
      - name: Lint Markdown
        # Globs + ignores live in .markdownlint-cli2.yaml so the action
        # discovers them via the standard config-file convention; passing
        # `globs:` here would override that and bypass the ignores list.
        uses: DavidAnson/markdownlint-cli2-action@v17

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          cache: true
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
        env:
          # Astro SSR imports src/lib/db.ts and src/lib/session.ts at build
          # time. Both throw at module-import if their env is missing — the
          # structural placeholders below keep the build green without any
          # secret fallback. CI never connects to the DB; the URL is shape-
          # only. Don't add a `${{ secrets.* }}` fallback "just in case" —
          # that turns absence-of-secret into a silent footgun where a
          # configured prod-ish DSN would silently flow into the build env.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_MODE: dev
          SESSION_SECRET: ci-placeholder-secret-32-bytes-minimum-________

  test:
    name: Test
    runs-on: ubuntu-latest
    # Postgres service container — matches the postgres:17-alpine image in
    # docker-compose.yml so local dev and CI exercise the same DB version.
    # The GHA `services:` keyword is simpler than orchestrating compose
    # here; compose stays the local-dev path.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cmdb
          POSTGRES_PASSWORD: cmdb
          # cmdb_test matches the strict /^[a-z][a-z0-9_]*_(test|ci)$/i
          # guard in tests/setup-db.ts. No CI bypass: the guard applies
          # uniformly to local and CI so a misconfigured workflow can't
          # silently wipe a production-shaped DB.
          POSTGRES_DB: cmdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmdb -d cmdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cmdb:cmdb@localhost:5432/cmdb_test
      AUTH_MODE: dev
      SESSION_SECRET: ci-placeholder-secret-32-bytes-minimum-________
      HOST: 127.0.0.1
      # Integration-test server runs on :4322, not the dev-server's :4321
      # (the test suite defaults TEST_BASE_URL to :4322 for the same reason
      # — keeps the dev-server port reserved for `bun run dev`).
      PORT: "4322"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          cache: true
      - run: bun install --frozen-lockfile
      - name: Apply migration + seed test fixture
        run: bun run tests/setup-db.ts
      - name: Build
        run: bun run build
      - name: Start server (background)
        run: bun run start &
      - name: Wait for server
        # TCP-only probe (bash builtin /dev/tcp). Probes "server is
        # listening", not "/services returns 2xx" — a real /services
        # regression (500/401/404) must fail the test suite below, not
        # be hidden as "server did not come up".
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/4322) 2>/dev/null; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not come up within 30s"
          exit 1
      - name: Run tests
        run: bun test
