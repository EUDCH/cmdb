name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2 requires a paid license for org repos; running
      # the OSS gitleaks binary directly keeps the scan free + reproducible.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          cache: true
      - run: bun install --frozen-lockfile
      - name: TypeScript & Astro type-check
        run: bun run check
      - name: TypeScript type-check
        run: bun run typecheck
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: "**/*.md"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          cache: true
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
        env:
          # Astro SSR imports src/lib/db.ts and src/lib/session.ts at build
          # time. Both throw at module-import if their env is missing — the
          # placeholders here keep the build green without touching prod
          # secrets. CI never connects to the DB; the URL is structural.
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci' }}
          AUTH_MODE: dev
          SESSION_SECRET: ci-placeholder-secret-32-bytes-minimum-________

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun test
